services:
  postgres:
    restart: always
    image: postgres:17
    container_name: zebrafish_mlflow_postgres
    ports:
      - "0.0.0.0:${PG_PORT}:5432"
    networks:
      - mlflow_backend
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DATABASE=${PG_DATABASE}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-p", "5432", "-U", "${PG_USER}"]
      interval: 5s
      timeout: 5s
      retries: 3

  minio:
    restart: always
    image: minio/minio:latest
    container_name: zebrafish_mlflow_minio
    ports:
      - "0.0.0.0:${MLFLOW_S3_ENDPOINT_PORT}:9000"
      - "0.0.0.0:${MINIO_CONSOLE_PORT}:9001"
    networks:
      - mlflow_backend
    environment:
      - MINIO_ROOT_USER=${AWS_ACCESS_KEY_ID}
      - MINIO_ROOT_PASSWORD=${AWS_SECRET_ACCESS_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  pg_data:
  minio_data:

networks:
  mlflow_backend:
    driver: bridge
