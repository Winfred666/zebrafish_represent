# VolDiT-XS/4 for zebrafish 128^3 crops encoded by ds8 VQ-GAN -> 16^3 latents.
stage1_model:
  class_name: MONAIVQGAN
  params:
    spatial_dims: 3
    in_channels: 1
    out_channels: 1
    channels: [128, 256, 512]
    num_res_channels: [128, 256, 512]
    num_res_layers: 2
    downsample_parameters: [[2, 4, 1, 1], [2, 4, 1, 1], [2, 4, 1, 1]]
    upsample_parameters: [[2, 4, 1, 1, 0], [2, 4, 1, 1, 0], [2, 4, 1, 1, 0]]
    num_embeddings: 4096
    embedding_dim: 8
    commitment_cost: 0.25
    decay: 0.99
    epsilon: 1.0e-5
    dropout: 0.0
    act: "RELU"
    output_act: null
    ddp_sync: true
    use_checkpointing: false
    load_from_ckpt: result/checkpoints/voldit_vqgan_lg025_s1_20ep_best.pth
    strict_load: true

model:
  class_name: VolDiT
  params:
    input_size: [16, 16, 16]
    patch_size: 4
    in_channels: 8
    hidden_size: 384
    depth: 6
    num_heads: 6
    mlp_ratio: 4.0
    class_dropout_prob: 0.0
    num_classes: 0
    learn_sigma: false
    flash_attention: false
    load_from_ckpt: result/checkpoints/voldit_xs_luna_pretrained.pth
    strict_load: false
