# TRELLIS sparse-structure VAE initialized from local sparse-structure checkpoints.
# Usage: --model-config config/model/trellis_ss_vae.yaml
model:
  class_name: TRELLISSparseStructureVAE
  params:
    in_channels: 1
    out_channels: 1
    channels: [32, 128, 512]
    decoder_channels: [512, 128, 32]
    latent_channels: 8
    num_res_blocks: 2
    num_res_blocks_middle: 2
    norm_type: layer
    use_fp16: true
    load_from_ckpt: null
    encoder_ckpt_path: result/checkpoints/sparse_structure/ss_enc_conv3d_16l8_fp16.safetensors
    decoder_ckpt_path: result/checkpoints/sparse_structure/ss_dec_conv3d_16l8_fp16.safetensors
    strict_load: true
