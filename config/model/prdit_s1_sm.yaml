model:
  class_name: PRDiT
  params:
    in_channels: 1
    out_channels: 2 # params of local denoiser
    input_size: [64, 64, 64]
    patch_size: [4, 4, 4]
    extract_patch_size: [8, 8, 8]
    extract_stride: [4, 4, 4]
    extract_padding: [2, 2, 2]
    hidden_size: 384

    depth: 0 # params of global residual DiT
    num_heads: 6
    mlp_ratio: 1.0 # NO hidden layer in all mlp
    coarse_mlp_ratio: 1.0
