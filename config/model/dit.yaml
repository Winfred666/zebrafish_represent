# Raw patchwise DiT-XS/2 matching config/model/voldit_dit_ds8_xs2_whole_ds0125.yaml
# without the frozen ds8 VQ-GAN encoder/decoder.
model:
  class_name: DiT3D
  params:
    in_channels: 1
    out_channels: 1
    input_size: [64, 512, 128]
    patch_size: [16, 16, 16]
    hidden_size: 384
    depth: 6
    num_heads: 6
    mlp_ratio: 4.0
    pos_encoding_type: sinusoidal
