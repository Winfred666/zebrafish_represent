model:
  class_name: DiT3D
  params:
    in_channels: 1
    out_channels: 1
    input_size: [4, 4, 4]
    patch_size: [2, 2, 2]
    hidden_size: 64
    depth: 2
    num_heads: 4
    mlp_ratio: 2.0
    tokenizer:
      class_name: ConvPatchTokenizer3D
      params:
        in_channels: 1
        embed_dim: 64
        patch_size: [2, 2, 2] # should be same as model.params.patch_size
        stride: [2, 2, 2]
        padding: [0, 0, 0]
