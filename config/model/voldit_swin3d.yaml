# Single-scale Swin3D defaults for ds8 latent diffusion of full zebrafish volumes.
stage1_model:
  class_name: MONAIVQGAN
  params:
    spatial_dims: 3
    in_channels: 1
    out_channels: 1
    channels: [128, 256, 512]
    num_res_channels: [128, 256, 512]
    num_res_layers: 2
    downsample_parameters: [[2, 4, 1, 1], [2, 4, 1, 1], [2, 4, 1, 1]]
    upsample_parameters: [[2, 4, 1, 1, 0], [2, 4, 1, 1, 0], [2, 4, 1, 1, 0]]
    num_embeddings: 4096
    embedding_dim: 8
    commitment_cost: 0.25
    decay: 0.99
    epsilon: 1.0e-5
    dropout: 0.0
    act: "RELU"
    output_act: null
    ddp_sync: true
    use_checkpointing: false
    load_from_ckpt: result/checkpoints/voldit_vqgan_lg00625_washed_picked_20260817.pth
    strict_load: false

model:
  class_name: VolSwinTransformer
  params:
    input_size: [4, 32, 8]
    patch_size: 1
    in_channels: 8
    width: 384
    depth: 8
    heads: 6
    window_size: [4, 8, 4]
    mlp_ratio: 4.0
    shift: true
