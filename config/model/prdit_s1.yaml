model:
  class_name: PRDiT
  params:
    in_channels: 1
    out_channels: 2 # params of local denoiser
    input_size: [128, 128, 128]
    patch_size: [8, 8, 8]
    extract_patch_size: [12, 12, 12]
    extract_stride: [8, 8, 8]
    extract_padding: [2, 2, 2]
    hidden_size: 768

    depth: 0 # params of global residual DiT
    num_heads: 12
    mlp_ratio: 4.0
    coarse_mlp_ratio: 1.0
