seed: 42
resume_ckpt_path: null
load_from_ckpt: null

data:
  train_dir: tests/fixtures/tif
  val_dir: null
  batch_size: 1
  num_workers: 0
  crop_size: [4, 4, 4]
  samples_per_volume_train: 1
  samples_per_volume_val: 0
  max_files_train: 1
  max_files_val: 0
  scale_factor: [1.0, 1.0, 1.0]
  normalize: true
  clip_percentile: [1.0, 99.0]
  pad_to_multiple: null

model:
  in_channels: 1
  out_channels: 1
  input_size: [4, 4, 4]
  patch_size: [2, 2, 2]
  hidden_size: 64
  depth: 2
  num_heads: 4
  mlp_ratio: 2.0
  attention_backend: auto
  input_representation: volume

train:
  framework: rectified_flow
  learning_rate: 0.0001
  weight_decay: 0.0001
  loss_type: mse
  sample_steps: 4
  ddpm:
    num_train_timesteps: 32
    beta_schedule: linear
    beta_start: 0.0001
    beta_end: 0.02
    prediction_type: epsilon
    noise_dataset_mode: module
    deterministic_noise_seed: 1234

logging:
  backend: mlflow
  tracking_uri: null
  experiment: zebrafish_volume_gen
  run_name: null
  job_type: train
  group: null
  tags: {}
  log_model: false
  gpu_memory_monitor:
    enabled: false
    log_frequency_mins: 1

trainer:
  max_epochs: 1
  accelerator: auto
  devices: 1
  precision: "32"
  log_every_n_steps: 1
  check_val_every_n_epoch: 1
  enable_checkpointing: true
  gradient_clip_val: 1.0
  num_sanity_val_steps: 0
  accumulate_grad_batches: 1
  limit_train_batches: 1.0
  limit_val_batches: 0.0

checkpoint:
  monitor: train/loss
  mode: min
  save_top_k: 1
  save_last: true
  filename: epoch{epoch:03d}-step{step:06d}

early_stopping:
  enabled: false
  monitor: val/loss
  mode: min
  patience: 5
  min_delta: 1.0e-5
  strict: false
  check_finite: true

testing:
  run_sampling_after_fit: true
  num_samples: 1
  sample_steps: 4
