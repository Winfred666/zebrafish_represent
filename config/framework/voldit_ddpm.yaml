# Stage-2 VolDiT latent DDPM training over frozen VQ-GAN latents.
framework:
  class_name: LatentDDPMModule
  params:
    model: runtime.model
    stage1_model: runtime.stage1_model
    scale_factor: 2.89
    stat_metrics_every_n_epochs: 200
    use_ema: false
    ema_decay: 0.9999
    optimization:
      learning_rate: 0.00004
      weight_decay: 0.01
      adam_beta1: 0.9
      adam_beta2: 0.999
      lr_scheduler: exponential
      lr_decay_gamma: 0.999
      loss_type: smooth_l1
      sample_steps: 300
    diffusion:
      num_train_timesteps: 300
      beta_schedule: cosine
      beta_start: 0.0001
      beta_end: 0.02
      prediction_type: v_prediction
      timestep_respacing: null
      gen_noise_weight: 1.0
