framework:
  class_name: MAEFinetuneModule
  params:
    model: runtime.model
    optimization:
      learning_rate: 0.0001
      weight_decay: 0.05
      loss_type: mse
      sample_steps: 1
    diffusion:
      timestep_respacing: null
      gen_noise_weight: 0.001
    mae:
      mask_ratio: 0.3
      foreground_weight: 10.0
      foreground_percentile: 85.0
