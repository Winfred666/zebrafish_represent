framework:
  class_name: RectifiedFlowModule
  params:
    model: runtime.model
    optimization:
      learning_rate: 0.0001
      weight_decay: 0.0001
      loss_type: mse
      sample_steps: 4
    diffusion:
      timestep_respacing: null
      gen_noise_weight: 0.5
    testing:
      run_sampling_after_fit: true
      num_samples: 100
      sample_steps: 1000
