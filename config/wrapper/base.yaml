seed: 42
resume_ckpt_path: null

logging:
  backend: mlflow
  tracking_uri: null
  experiment: zebrafish_volume_gen
  run_name: null
  tags:
    job_type: train
  log_model: false
  gpu_memory_monitor:
    enabled: false
    log_frequency_mins: 1

trainer:
  max_epochs: 1
  accelerator: auto
  devices: 1
  precision: "32"
  log_every_n_steps: 1
  check_val_every_n_epoch: 1
  enable_checkpointing: true
  gradient_clip_val: 1.0
  num_sanity_val_steps: 0
  accumulate_grad_batches: 1
  limit_train_batches: 1.0
  limit_val_batches: 0.0

checkpoint:
  monitor: train/loss
  mode: min
  save_top_k: 1
  save_last: true
  filename: epoch{epoch:03d}-step{step:06d}

early_stopping:
  enabled: false
  monitor: val/loss
  mode: min
  patience: 5
  min_delta: 1.0e-5
  strict: false
  check_finite: true

testing:
  run_sampling_after_fit: true
  num_samples: 1
  sample_steps: 4
