import_config: base.yaml

trainer:
  params:
    accelerator: gpu
    devices: 4
    strategy: ddp_find_unused_parameters_false
    precision: "bf16-mixed"
    deterministic: false
    num_sanity_val_steps: 0
    callbacks:
      - class_name: ModelCheckpoint
        params:
          monitor: val_loss
          mode: min
          save_top_k: 1
          save_last: true
          filename: "epoch{epoch:03d}-step{step:06d}"
          dirpath: /home/ym.xiao/workspace/zebrafish_represent/result/checkpoints/perceptual_net_resnet50_vicreg_gpu04_tmp
      - class_name: IntegratedGPUMemoryMonitor
        params:
          log_frequency_mins: 1
      - class_name: EarlyStopping
        params:
          monitor: val_loss
          mode: min
          patience: 8
          min_delta: 1.0e-5
          strict: false
          check_finite: true
      - class_name: LearningRateMonitor
        params:
          logging_interval: epoch

logging:
  params:
    experiment_name: medical_resnet_ft
    run_name: perceptual_net_resnet50_vicreg_lg025_network_file_gpu04_ddp4_lr1e5_e40
    tags:
      stage: perceptual_resnet50_vicreg
      node: gpu04
