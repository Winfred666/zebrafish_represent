import_config: ddp4_recon_e20_early_stop.yaml

artifact_manager:
  class_name: ArtifactManager
  params:
    logger: runtime.logging
    staging_root: /dev/shm/zrf_washed_20260817_runtime_temp

trainer:
  params:
    devices: 8
    max_epochs: 200
    deterministic: false
    check_val_every_n_epoch: 200
    callbacks:
      - class_name: ModelCheckpoint
        params:
          monitor: val_loss
          mode: min
          save_top_k: 1
          save_last: true
          filename: "epoch{epoch:03d}-step{step:06d}"
          dirpath: runtime.artifact_manager.checkpoint_dir
      - class_name: IntegratedGPUMemoryMonitor
        params:
          log_frequency_mins: 1
      - class_name: LearningRateMonitor
        params:
          logging_interval: epoch
