import_config: base.yaml

artifact_manager:
  class_name: ArtifactManager
  params:
    logger: runtime.logging
    staging_root: /data/volume3/share_storage/ym.xiao/dataresult/zebrafish/result/temp/runtime_temp

resume_ckpt_path: null

train_dataloader:
  params:
    batch_size: 64
    num_workers: 2
    prefetch_factor: 1
    persistent_workers: false
    drop_last: true

val_dataloader:
  params:
    batch_size: 64
    num_workers: 2
    prefetch_factor: 1
    persistent_workers: false
    drop_last: false

trainer:
  params:
    devices: 7
    strategy: ddp_find_unused_parameters_true
    precision: "bf16-mixed"
    max_epochs: 20006
    check_val_every_n_epoch: 403
