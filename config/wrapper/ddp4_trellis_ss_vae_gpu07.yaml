import_config: base.yaml

trainer:
  params:
    max_epochs: 40
    devices: 4
    strategy: ddp_find_unused_parameters_false
    precision: "bf16-true"
    check_val_every_n_epoch: 3
    num_sanity_val_steps: 1
    gradient_clip_val: 1.0
    log_every_n_steps: 1
    callbacks:
      - class_name: ModelCheckpoint
        params:
          monitor: val_recon_loss
          mode: min
          save_top_k: 1
          save_last: true
          filename: "epoch{epoch:03d}-step{step:06d}"
          dirpath: runtime.artifact_manager.checkpoint_dir
      - class_name: IntegratedGPUMemoryMonitor
        params:
          log_frequency_mins: 1
      - class_name: LearningRateMonitor
        params:
          logging_interval: epoch

logging:
  params:
    tags:
      job_type: train
      pipeline: trellis_ss_vae_occupancy
      launch_profile: ddp4_gpu07
