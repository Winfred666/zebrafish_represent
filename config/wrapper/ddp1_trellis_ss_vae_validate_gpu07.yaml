import_config: base.yaml

run_mode: validate
resume_ckpt_path: null

trainer:
  params:
    max_epochs: 0
    devices: 1
    precision: "bf16-true"
    deterministic: true
    check_val_every_n_epoch: 1
    num_sanity_val_steps: 0
    enable_checkpointing: false
    gradient_clip_val: 1.0
    limit_train_batches: 1.0
    limit_val_batches: 1.0
    log_every_n_steps: 1
    callbacks:
      - class_name: IntegratedGPUMemoryMonitor
        params:
          log_frequency_mins: 1

logging:
  params:
    tags:
      job_type: validate
      pipeline: trellis_ss_vae_occupancy
      launch_profile: ddp1_validate_gpu07
