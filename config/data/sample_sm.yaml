import_config: base.yaml

train_dataset:
  params:
    data_dir: data/raw/sample_sm/train
    crop_size: [4, 4, 4]
    samples_per_volume: 1
    max_files: 1
    scale_factor: [1.0, 1.0, 1.0]

train_dataloader:
  batch_size: 1
  num_workers: 0
  shuffle: true

val_dataset:
  params:
    data_dir: data/raw/sample_sm/val
    crop_size: [4, 4, 4]
    samples_per_volume: 0
    max_files: 0
    scale_factor: [1.0, 1.0, 1.0]

val_dataloader:
  batch_size: 1
  num_workers: 0
  shuffle: false
