train_dataset: # purely raw dataset
  class_name: CropTifVolumeHotDataset
  params:
    data_dir: /data/volume3/share_storage/ym.xiao/dataresult/zebrafish/data/raw/sample_sm/train
    crop_size: [64, 64, 64]
    # Fraction of overlap between adjacent grid crops in each spatial dim.
    # 0.0 = adjacent (no overlap), 0.5 = 50% overlap.
    overlap: [0.0, 0.0, 0.0]
    max_files: null
    # Downsample volumes to 1/8 of original resolution to control grid-crop count.
    scale_factor: [0.125, 0.125, 0.125]
    normalize: true
    # (low, high) percentile pair for intensity clipping before min-max normalization.
    # Clips extreme voxels (e.g. sensor noise, bright artifacts) so they don't
    # stretch the value range. Applied before scaling to [0, 1].
    clip_percentile: [0.0, 100.0]
    pad_to_multiple: null
    cache_root: /tmp/zebrafish_hot_mmap

train_dataloader:
  class_name: DataLoader
  params:
    dataset: runtime.train_dataset
    batch_size: 32
    num_workers: 8 # num worker is totally.
    shuffle: true
    pin_memory: true
    persistent_workers: true

val_dataset:
  class_name: CropTifVolumeHotDataset
  params:
    data_dir: /data/volume3/share_storage/ym.xiao/dataresult/zebrafish/data/raw/sample_sm/val
    crop_size: [64, 64, 64]
    # No overlap for validation — each voxel appears in exactly one crop (to see artifact cleanly)
    overlap: [0.0, 0.0, 0.0]
    max_files: null
    # Downsample volumes to 1/8 of original resolution to control grid-crop count.
    scale_factor: [0.125, 0.125, 0.125]
    normalize: true
    clip_percentile: [0.0, 100.0]
    pad_to_multiple: null
    cache_root: /tmp/zebrafish_hot_mmap

val_dataloader:
  class_name: DataLoader
  params:
    dataset: runtime.val_dataset
    batch_size: 4
    num_workers: 4
    shuffle: false
    pin_memory: true
    persistent_workers: true
