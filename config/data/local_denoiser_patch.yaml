train_dataset:
  class_name: TifVolumePatchDataset
  params:
    data_dir: data/raw/sample_sm/train
    samples_per_volume: 1
    max_files: 1

train_dataloader:
  dataset: runtime.train_dataset
  shuffle: true

val_dataset:
  class_name: TifVolumePatchDataset
  params:
    data_dir: data/raw/sample_sm/val
    samples_per_volume: 1
    max_files: 1

val_dataloader:
  dataset: runtime.val_dataset
  shuffle: false
