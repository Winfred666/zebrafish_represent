# Example configuration for training 3D U-Net on zebrafish volumes

# Random seed for reproducibility
seed: 42

# Data configuration
data:
  train_path: "data/train.pt"
  val_path: "data/val.pt"
  batch_size: 1
  num_workers: 1

# Model configuration
model:
  in_channels: 1
  out_channels: 1
  features: [32, 64, 128]  # Feature channels at each U-Net level
  trilinear: false  # Use trilinear upsampling (false = transposed conv)
  use_batchnorm: true
  loss_type: "mse"  # Options: "mse", "l1", "smooth_l1"

# Training configuration
training:
  learning_rate: 0.0001
  weight_decay: 0.00001
  max_epochs: 10
  early_stopping: true
  patience: 10  # Early stopping patience
  deterministic: false  # Set to true for reproducible results (slower)

# Trainer configuration
trainer:
  accelerator: "auto"  # Options: "cpu", "gpu", "cuda", "mps", "auto"
  devices: "auto"  # Number of devices or "auto"
  precision: "32"  # Options: "32", "16", "bf16"
  gradient_clip_val: 0.5
  accumulate_grad_batches: 1

# Checkpoint configuration
checkpoint:
  dir: "checkpoints"
  save_top_k: 3  # Save top 3 models

# Logging configuration
logging:
  experiment_name: "quick_test/unet"
